# System Configuration
system:
  name: "Multi-Modal Biometric Auth"
  version: "0.1.0"
  debug: true

# Camera settings
camera:
  device_id: 0                    # Default webcam
  resolution:
    width: 640
    height: 480
  fps: 30
  warmup_frames: 5                # Frames to skip for camera warmup

# Face recognition settings
face_recognition:
  detection_model: "hog"          # "cnn" (GPU) or "hog" (CPU)
  encoding_model: "small"         # "large" (accurate) or "small" (fast)
  num_jitters: 1                  # Re-sampling for encoding
  match_tolerance: 0.6            # Distance threshold (lower = stricter)
  strict_tolerance: 0.5           # For high-security mode
  min_face_size: 50               # Minimum face size in pixels
  
# Quality thresholds
quality:
  min_brightness: 40              # Minimum average brightness (0-255)
  max_brightness: 220             # Maximum average brightness
  min_sharpness: 50               # Laplacian variance threshold
  face_detection_confidence: 0.8  # Minimum confidence for face detection

# Database settings
database:
  path: "data/biometric.db"
  encrypt_templates: false        # Set to true for production

# Enrollment settings  
enrollment:
  num_samples: 5                  # Number of face samples to capture
  sample_interval: 0.5            # Seconds between samples
  require_quality_check: true

# Verification settings
verification:
  max_attempts: 3
  timeout_seconds: 30
  require_liveness: true          # Blink-based anti-spoof (see liveness section)

# Iris (eye-region appearance) recognition settings
iris:
  threshold: 0.65                 # Distance threshold (lower = stricter)
  num_samples: 3                  # Eye samples averaged per eye at enrollment
  min_sharpness: 15.0             # Laplacian-variance gate for eye crops
  metric: "rmse"                  # "rmse" or "correlation"

# Score-level fusion (multi-modal decision)
fusion:
  face_weight: 0.6                # Must sum to 1.0 with iris_weight
  iris_weight: 0.4
  combined_threshold: 0.6         # On normalized [0,1] weighted score

# Liveness / anti-spoof (blink detection)
liveness:
  ear_threshold: 0.21             # Eye-aspect-ratio below this = eye closed
  min_blinks: 1                   # Blinks required within the capture window
  timeout_seconds: 6.0            # Max time to wait for a blink
